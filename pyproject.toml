[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "hermes-futures-lab"
version = "0.0.1"
description = "Deterministic, local futures practice lab: P0 specification skeleton"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
futures-lab = "futures_lab.cli:main"

[dependency-groups]
dev = ["jsonschema==4.25.1", "PyYAML==6.0.3"]

[tool.hatch.build.targets.wheel]
packages = ["src/futures_lab"]
