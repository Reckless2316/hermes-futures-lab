[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "hermes-futures-lab"
version = "0.0.1"
description = "Deterministic local futures ledger and candidate Growth lab evaluator"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["PyYAML==6.0.3"]

[project.scripts]
futures-lab = "futures_lab.cli:main"

[dependency-groups]
dev = [
    "jsonschema==4.25.1",
    "PyYAML==6.0.3",
    "pytest==9.0.3",
    "ruff==0.13.0",
    "mypy==1.18.1",
    "pip-audit==2.9.0",
    "detect-secrets==1.5.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/futures_lab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv]
required-version = "==0.12.17"
build-constraint-dependencies = [
  "hatchling==1.27.0",
  "packaging==26.3",
  "pathspec==1.1.1",
  "pluggy==1.6.0",
  "trove-classifiers==2026.6.1.19",
]

[tool.hatch.build.targets.wheel.force-include]
"rules" = "futures_lab/resources/rules"
