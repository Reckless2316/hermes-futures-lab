name: P1 validation
on:
  pull_request:
  push:
    branches: [main, feat/p1-deterministic-engine]
permissions:
  contents: read
jobs:
  locked-validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: "0.12.17"
      - run: uv sync --locked
      - run: uv run --locked python -m unittest discover -s tests -v
      - run: uv run --locked pytest -q
      - run: uv run --locked python scripts/verify_p0_artifacts.py
      - run: uv run --locked mypy --ignore-missing-imports --check-untyped-defs src/futures_lab
      - run: uv run --locked ruff check src/futures_lab tests scripts/check_secrets.py scripts/smoke_wheel.py --select F
      - run: uv run --locked ruff format --check src/futures_lab tests/test_domain.py tests/test_engine.py tests/test_financial_rules.py tests/test_assessment.py tests/test_p1_cli.py scripts/check_secrets.py scripts/smoke_wheel.py
      - run: uv run --locked python scripts/check_secrets.py
      - name: Audit locked dependencies
        run: |
          uv export --locked --no-emit-project --format requirements-txt --output-file /tmp/audit-requirements.txt
          uv run --locked pip-audit --strict --disable-pip --require-hashes -r /tmp/audit-requirements.txt --progress-spinner off
      - run: uv build --no-sources
      - run: uv run --locked python scripts/smoke_wheel.py
